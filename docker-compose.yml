services:
  postgres:
    image: postgis/postgis:16-3.4
    # DB_DATABASE/DB_USERNAME/DB_PASSWORD also exist in api/.env (Laravel's own config), but that
    # copy is never read here and is overridden on the api/queue/scheduler/reverb services below,
    # so the root .env is the single source of truth for these 3 values. Keeping them in sync by
    # hand is exactly the bug this works around: edit them only here, not in api/.env.
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/20-create-test-database.sh:/docker-entrypoint-initdb.d/20-create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: outage-map-api:local
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/var/www/html
      - api-vendor:/var/www/html/vendor
    env_file:
      - ./api/.env
    # DB_DATABASE/DB_USERNAME/DB_PASSWORD are intentionally overridden here (env_file/environment
    # combined; `environment` wins) so the root .env is the single source of truth for the DB
    # credentials shared with the `postgres` service below. See the comment on `postgres` for why.
    environment:
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # `migrate:status` alone only proves the PHP CLI can reach the DB — it says nothing about
      # whether the FPM *master* process is actually bound and listening on 9000. `nc` ships in
      # this base image (busybox) and `-z` does a zero-I/O connect check, so combining both means
      # the service is only reported healthy when FPM is actually accepting FastCGI connections
      # AND the app can talk to the database.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 && php artisan migrate:status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./api:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${API_PORT:-8000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  queue:
    image: outage-map-api:local
    build:
      context: ./api
      dockerfile: Dockerfile
    command: php artisan queue:work --sleep=1 --tries=3
    volumes:
      - ./api:/var/www/html
      - api-vendor:/var/www/html/vendor
    env_file:
      - ./api/.env
    # See the comment on the `postgres` service: root .env is the single source of truth.
    environment:
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: outage-map-api:local
    build:
      context: ./api
      dockerfile: Dockerfile
    command: php artisan schedule:work
    volumes:
      - ./api:/var/www/html
      - api-vendor:/var/www/html/vendor
    env_file:
      - ./api/.env
    # See the comment on the `postgres` service: root .env is the single source of truth.
    environment:
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    image: outage-map-api:local
    build:
      context: ./api
      dockerfile: Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./api:/var/www/html
      - api-vendor:/var/www/html/vendor
    env_file:
      - ./api/.env
    # See the comment on the `postgres` service: root .env is the single source of truth.
    environment:
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${REVERB_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    env_file:
      - ./client/.env
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  api-vendor:
  client-node-modules:
