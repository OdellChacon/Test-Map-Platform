openapi: 3.0.3
info:
  title: Outage Map Platform API
  description: >-
    Power outage reporting platform with a live public map. In addition to
    the REST endpoints below, the server broadcasts a `report.changed` event
    (payload: `{ action: "created"|"updated"|"removed", id, report }`) over a
    public Reverb WebSocket channel named `outages` whenever a report is
    created, edited, closed, confirmed, or expires. This is a plain Pusher
    protocol channel (no OpenAPI equivalent), connected to with Laravel Echo.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Auth
  - name: Reports
  - name: Public

paths:
  /sanctum/csrf-cookie:
    get:
      tags: [Auth]
      summary: Issue the XSRF-TOKEN cookie required before any mutating request
      responses:
        '204':
          description: Cookie issued

  /api/v1/register:
    post:
      tags: [Auth]
      summary: Create an account and start an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/login:
    post:
      tags: [Auth]
      summary: Start a session for an existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/logout:
    post:
      tags: [Auth]
      summary: End the current session
      security:
        - sessionAuth: []
      responses:
        '204':
          description: Session ended
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/reports:
    get:
      tags: [Reports]
      summary: List the authenticated user's own reports (paginated)
      security:
        - sessionAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paginated list of the caller's reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutageReportPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Reports]
      summary: Report a new outage
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreOutageReportRequest'
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutageReportResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/reports/{report}:
    patch:
      tags: [Reports]
      summary: Edit the radius, duration or description of an active report you own
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOutageReportRequest'
      responses:
        '200':
          description: Report updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutageReportResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/reports/{report}/close:
    post:
      tags: [Reports]
      summary: Close an active report you own
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Report closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutageReportResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The report is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/v1/reports/{report}/confirm:
    post:
      tags: [Reports]
      summary: Confirm an active report someone else created
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: You cannot confirm your own report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '422':
          description: The report is not active, or you already confirmed it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/public/reports:
    get:
      tags: [Public]
      summary: List active outages inside a bounding box (no authentication, no personal data)
      parameters:
        - name: south_west_lat
          in: query
          required: true
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90
        - name: south_west_lng
          in: query
          required: true
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180
        - name: north_east_lat
          in: query
          required: true
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90
        - name: north_east_lng
          in: query
          required: true
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Active outages inside the requested area
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOutageReportCollectionResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: >-
        Laravel Sanctum SPA cookie-based session. Call GET /sanctum/csrf-cookie
        first, then send the XSRF-TOKEN cookie value back as the X-XSRF-TOKEN
        header on every mutating request, with an Origin matching a configured
        stateful domain.

  parameters:
    ReportId:
      name: report
      in: path
      required: true
      schema:
        type: integer

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email

    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'

    StoreOutageReportRequest:
      type: object
      required: [latitude, longitude, radius_km, duration_type]
      properties:
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
        radius_km:
          type: number
          format: float
          minimum: 0.5
          maximum: 25
        duration_type:
          $ref: '#/components/schemas/ReportDurationType'
        duration_hours:
          type: integer
          nullable: true
          minimum: 1
          maximum: 72
          description: Required when duration_type is "fixed"; ignored otherwise.
        description:
          type: string
          nullable: true
          maxLength: 500

    UpdateOutageReportRequest:
      type: object
      properties:
        radius_km:
          type: number
          format: float
          minimum: 0.5
          maximum: 25
        duration_hours:
          type: integer
          minimum: 1
          maximum: 72
          description: Only allowed when the report's duration_type is "fixed".
        description:
          type: string
          nullable: true
          maxLength: 500

    ReportStatus:
      type: string
      enum: [active, closed, expired]

    ReportDurationType:
      type: string
      enum: [fixed, until_closed]

    OutageReport:
      type: object
      properties:
        id:
          type: integer
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        radius_km:
          type: number
          format: float
        duration_type:
          $ref: '#/components/schemas/ReportDurationType'
        duration_hours:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/ReportStatus'
        description:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
          description: Resolved asynchronously after creation; null until the reverse-geocoding job completes.
        confirmations_count:
          type: integer
        expires_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    OutageReportResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OutageReport'

    OutageReportPaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OutageReport'
        links:
          type: object
          properties:
            first: { type: string }
            last: { type: string }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }

    PublicOutageReport:
      type: object
      description: Carries no personal data - no user, no description.
      properties:
        id:
          type: integer
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        radius_km:
          type: number
          format: float
        address:
          type: string
          nullable: true
        confirmations_count:
          type: integer
        expires_at:
          type: string
          format: date-time

    ConfirmationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            confirmations_count:
              type: integer

    PublicOutageReportCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicOutageReport'

    ErrorMessage:
      type: object
      properties:
        message:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    ValidationError:
      description: The request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    Unauthenticated:
      description: No authenticated session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    Forbidden:
      description: The authenticated user does not own this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
